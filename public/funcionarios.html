<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Funcionários</title>
    <link rel="stylesheet" href="funcionario.css">
    <script src="funcionario.js"></script>
</head>
<body>
        <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Controle de Funcionários</h2>
            </div>
            <nav>
                <ul>
                     <li><a href="index.html">Menu</a></li>
                     <li><a href="produto.html">Produtos</a></li>
                     <li><a href="cliente.html">Clientes</a></li>
                     <li><a href="funcionarios.html">Funcionários</a></li>
                     <li><a href="fornecedor.html">Fornecedores</a></li>
                     <li><a href="venda.html">Vendas</a></li>
                     <li><a href="relatorios.html">Relatórios</a></li>

                </ul>
            </nav>
        </aside>

        <div class="main-content">
            <div id="main-container">
                <h1>Cadastro de Funcionário</h1>
                <form id="funcionario-form">
                    <div class="full-box">
                        <label for="cpf">CPF:</label>
                        <input type="text" id="cpf" name="cpf" placeholder="Digite cpf do funcionário" required autocomplete="on">
                    </div>
                    <div class="full-box">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite o nome do funcionário" required autocomplete="on">
                    </div>
                    <div class="half-box">
                        <label for="telefone">Telefone:</label>
                        <input type="text" id="telefone" name="telefone" placeholder="Digite o telefone" autocomplete="on">
                    </div>
                    <div class="half-box">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" placeholder="Digite o e-mail" autocomplete="on">
                    </div>
                    <div class="full-box">
                        <label for="endereco">Endereço:</label>
                        <input type="text" id="endereco" name="endereco" placeholder="Digite o endereço completo" autocomplete="on">
                    </div>
                    <div class="full-box">
                        <input type="submit" value="Cadastrar" class="alinhaBtns" onclick="cadastrarFuncionario(event)">
                        <input type="reset" value="Limpar" class="alinhaBtns">
                    </div>
                </form>

                <!-- SEÇÃO DE PESQUISA AVANÇADA -->
                <h2>Pesquisar Funcionário</h2>
                <div class="search-container">
                    <div class="search-options">
                        <div class="search-option">
                            <input type="radio" id="search-by-name" name="search-type" value="nome" checked>
                            <label for="search-by-name">Nome</label>
                        </div>
                        <div class="search-option">
                            <input type="radio" id="search-by-cpf" name="search-type" value="cpf">
                            <label for="search-by-cpf">CPF</label>
                        </div>
                        <div class="search-option">
                            <input type="radio" id="search-by-email" name="search-type" value="email">
                            <label for="search-by-email">E-mail</label>
                        </div>
                        <div class="search-option">
                            <input type="radio" id="search-by-phone" name="search-type" value="telefone">
                            <label for="search-by-phone">Telefone</label>
                        </div>
                    </div>
                    <div class="search-inputs">
                        <input type="text" id="pesquisa-valor" placeholder="Digite o valor para pesquisar" autocomplete="on">
                        <button type="button" onclick="pesquisarFuncionario()" class="alinhaBtns">Pesquisar</button>
                        <button type="button" onclick="limparPesquisa()" class="alinhaBtns btn-clear">Limpar</button>
                    </div>
                </div>

                <h2>Listagem de Funcionários</h2>
                <button type="button" onclick="listarFuncionarios()" class="alinhaBtns">Listar Todos os Funcionários</button>

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>CPF</th>
                            <th>Email</th>
                            <th>Telefone</th>
                            <th>Endereço</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-funcionarios">
                        <!-- Linhas serão preenchidas pelo JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
            <!-- Modal de Edição -->
            <div id="editModal" class="modal">
                <div class="modal-content">
                    <span class="close" onclick="closeEditModal()">&times;</span>
                    <h2>Editar Funcionário</h2>
                    <form class="modal-form" id="edit-form">
                        <input type="hidden" id="edit-id">
                        <input type="hidden" id="edit-cpf-original">

                        <label for="edit-nome">Nome:</label>
                        <input type="text" id="edit-nome" required autocomplete="on">

                        <label for="edit-cpf">CPF:</label>
                        <input type="text" id="edit-cpf" required autocomplete="on" readonly>

                        <label for="edit-email">E-mail:</label>
                        <input type="email" id="edit-email" autocomplete="on">

                        <label for="edit-telefone">Telefone:</label>
                        <input type="text" id="edit-telefone" autocomplete="on">

                        <label for="edit-endereco">Endereço:</label>
                        <input type="text" id="edit-endereco" autocomplete="on">

                        <div class="modal-buttons">
                            <button type="button" class="btn-save" onclick="salvarEdicao()">Salvar</button>
                            <button type="button" class="btn-cancel" onclick="closeEditModal()">Cancelar</button>
                        </div>
                    </form>
                </div>
            </div>
</body>
</html>
